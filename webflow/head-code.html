<!-- Webflow → Site settings → Custom code → Head code. This is the only custom code snippet the site needs.
     eternity-website: loads all styles and site.min.js; site.min.js loads the Resource Library scripts where needed.
     Release: change the version (@0.3.0) in the href below. Nothing else needs editing. -->
<link id="ee-css" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/vsventuresx/eternity-website@0.3.0/dist/site.min.css">
<script>
  (function () {
    var css = document.getElementById('ee-css');
    var base = css.href.replace(/site\.min\.css.*$/, ''); // same folder and version as the stylesheet
    // Dev mode (localStorage "ee-dev" = "1"): load everything from `npm run dev` on this computer instead
    try {
      if (localStorage.getItem('ee-dev') === '1') {
        base = 'http://localhost:3000/';
        css.href = base + 'site.min.css';
      }
    } catch (e) {}
    var s = document.createElement('script');
    s.src = base + 'site.min.js';
    s.defer = true;
    document.head.appendChild(s);
  })();
</script>
