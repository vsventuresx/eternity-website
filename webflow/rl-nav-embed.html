<!-- Webflow → RL Nav component → replace the two code embeds (rl-core, rl-search) with this single embed.
     Loads the Resource Library bundle on every page that uses the RL Nav. Keep the version in step with the site snippets. -->
<link id="ee-rl-css" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/vsventuresx/eternity-website@0.1.0/dist/resources.min.css">
<script>
  (function () {
    var base = 'https://cdn.jsdelivr.net/gh/vsventuresx/eternity-website@0.1.0/dist/';
    try {
      if (localStorage.getItem('ee-dev') === '1') {
        base = 'http://localhost:3000/';
        document.getElementById('ee-rl-css').href = base + 'resources.min.css';
      }
    } catch (e) {}
    var s = document.createElement('script');
    s.src = base + 'resources.min.js';
    s.defer = true;
    document.head.appendChild(s);
  })();
</script>
